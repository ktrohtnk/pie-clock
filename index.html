<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pie Clock - Hour-Hand & Second-Ring Gradient Controls</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  body.idle { cursor: none; }
  body.idle .ui-panel { opacity: 0; pointer-events: none; }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
  }
  .ui-panel {
    transition: opacity 0.35s ease;
    z-index: 10;
  }
  #mobile-menu-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    background: rgba(26, 26, 32, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #ffffff;
    border: 1px solid #3c3c4c;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 20px;
    cursor: pointer;
    z-index: 25;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
  }
  #mobile-menu-btn:hover {
    background: rgba(38, 38, 48, 0.95);
    border-color: #55556a;
    transform: translateY(-1px);
  }
  #mobile-menu-btn:active {
    background: #38bdf8;
    color: #111111;
    transform: translateY(0);
  }
  #toolbar {
    display: none;
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 330px;
    max-width: calc(100vw - 28px);
    max-height: calc(100vh - 28px);
    max-height: calc(100dvh - 28px);
    background: rgba(18, 18, 24, 0.95);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid #323242;
    border-radius: 14px;
    box-shadow: 0 16px 44px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    padding: 14px 14px 16px;
    box-sizing: border-box;
    overflow-y: auto;
    z-index: 40;
    gap: 10px;
  }
  #toolbar.open,
  #toolbar.mobile-open {
    display: flex;
  }
  .mobile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a36;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
  }
  .mobile-close-btn {
    background: #2a2a36;
    border: 1px solid #444458;
    color: #eeeeee;
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mobile-close-btn:hover {
    background: #3e3e50;
    color: #ffffff;
  }
  .group-title {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 0.04em;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    background: transparent;
    padding: 0;
    border: none;
  }
  #toolbar button {
    background: #222226;
    color: #cccccc;
    border: 1px solid #3a3a42;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    border-radius: 6px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #toolbar button:hover {
    background: #2a2a32;
    color: #ffffff;
    border-color: #555566;
  }
  #toolbar button.active {
    background: #eeeeee;
    color: #111111;
    border-color: #eeeeee;
  }
  #toolbar button.theme-active {
    background: #38bdf8;
    color: #111111;
    border-color: #38bdf8;
    font-weight: 700;
  }
  #toolbar button.sec-active {
    background: #f59e0b;
    color: #111111;
    border-color: #f59e0b;
    font-weight: 700;
  }
  #toolbar select {
    background: #222226;
    color: #cccccc;
    border: 1px solid #3a3a42;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    border-radius: 6px;
  }
  #toolbar select.theme-active {
    background: #38bdf8;
    color: #111111;
    border-color: #38bdf8;
    font-weight: 700;
  }
  #link-status {
    width: 100%;
    font-size: 11px;
    line-height: 1.5;
    color: #9aa0aa;
    white-space: pre-line;
    text-align: left;
    padding: 4px 6px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    box-sizing: border-box;
  }
  #scrubber-bar {
    position: fixed;
    bottom: max(10px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(860px, calc(100vw - 24px));
    background: #18181c;
    border: 1px solid #33333a;
    padding: 8px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #dddddd;
    font-size: 12px;
    font-weight: 600;
    box-sizing: border-box;
  }
  .strip-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #888892;
    padding: 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .scrubber-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #sky-strip {
    height: 10px;
    width: 100%;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  #time-slider {
    flex: 1;
    cursor: pointer;
    accent-color: #ffffff;
    margin: 0;
    height: 24px;
  }
  #scrubber-time {
    min-width: 66px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* スマホ・タブレット縦向き用スタイル */
  @media (max-width: 768px) {
    #mobile-menu-btn {
      display: flex;
    }
    #toolbar {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 100%;
      border-radius: 0;
      border: none;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      gap: 12px;
    }
    .mobile-header {
      font-size: 16px;
      padding-bottom: 10px;
    }
    .mobile-close-btn {
      padding: 7px 16px;
      font-size: 13px;
    }
    .btn-group {
      flex-direction: column;
      gap: 7px;
    }
    #toolbar button {
      padding: 12px 14px;
      font-size: 14px;
      border-radius: 8px;
      text-align: left;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    #toolbar select {
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 8px;
      min-height: 44px;
    }
    #link-status {
      font-size: 12px;
      padding: 2px 2px 0;
      background: transparent;
    }
    #scrubber-bar {
      padding: 6px 12px 8px;
      gap: 3px;
    }
    .scrubber-row {
      gap: 8px;
    }
    #scrubber-bar .scrubber-title {
      font-size: 11px;
      white-space: nowrap;
    }
  }
  @media (max-width: 480px) {
    .scrubber-title {
      display: none;
    }
    .strip-labels span:nth-child(2n) {
      display: none;
    }
  }
</style>
</head>
<body>
<button id="mobile-menu-btn" class="ui-panel" title="設定メニュー (M / Esc)">⚙️ 設定</button>

<div id="toolbar" class="ui-panel">
  <div class="mobile-header">
    <span>Pie Clock 設定</span>
    <button id="mobile-close-btn" class="mobile-close-btn">✕ 閉じる</button>
  </div>

  <div class="group-title">カラーテーマ</div>
  <div class="btn-group">
    <button id="btn-theme-hourgrad" class="theme-active">① 短針だけグラデ 🌅</button>
    <button id="btn-theme-sky24h">② 短針・長針とも単色(24h空色) 🌤️</button>
    <button id="btn-theme-allgrad">③ 短針・長針ともグラデ 🌈</button>
    <button id="btn-theme-classic">④ 従来ソリッド版 🎨</button>
    <button id="btn-grad-dir">短針グラデ方向: 天頂➔地平線</button>
  </div>

  <div class="group-title">秒リング＆短針</div>
  <div class="btn-group">
    <button id="btn-sec-grad" class="sec-active">秒リング: グラデーション ✨</button>
    <button id="btn-hour-mode">短針: 滑らか</button>
  </div>

  <div class="group-title">空の連動（日の出・日の入り・マジックアワー）</div>
  <div class="btn-group">
    <button id="btn-link-off" class="theme-active">標準（固定時刻）</button>
    <button id="btn-link-gps">📍 現在地の太陽に連動</button>
    <select id="city-select" aria-label="都市を選んで連動">
      <option value="">🌍 都市を選んで連動…</option>
    </select>
    <div id="link-status"></div>
  </div>

  <div class="group-title">画面モード</div>
  <div class="btn-group">
    <button id="btn-live" class="active">現在時刻</button>
    <button id="btn-all8">8フェーズ一覧</button>
    <button id="btn-compare">昼(12:20) vs 夕陽(17:05)</button>
    <button id="btn-timelapse">24h早送り</button>
  </div>

  <div class="group-title">ディスプレイ</div>
  <div class="btn-group">
    <button id="btn-clock-size" class="theme-active">時計サイズ: どーんと大 (90%) ✨</button>
    <button id="btn-wake-lock" class="sec-active">📱 スリープ防止: ON</button>
  </div>
</div>

<div id="scrubber-bar" class="ui-panel">
  <div class="strip-labels">
    <span>00:00</span><span>03:00</span><span>06:00</span><span>09:00</span>
    <span>12:00</span><span>15:00</span><span>18:00</span><span>21:00</span><span>24:00</span>
  </div>
  <div id="sky-strip" title="短針（空の色）の24時間連続グラデーション推移"></div>
  <div class="scrubber-row">
    <span class="scrubber-title">短針(空の色) 24h連続推移</span>
    <input id="time-slider" type="range" min="0" max="86399" step="1" value="61500">
    <span id="scrubber-time">17:05:00</span>
  </div>
</div>

<canvas id="clock"></canvas>

  function getClockScaleFactor(isMobile, isPortrait) {
    if (clockScaleMode === 'huge') {

    } else if (clockScaleMode === 'standard') {

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function cosInterp(t) {
    return (1 - Math.cos(t * Math.PI)) * 0.5;
  }

  function lerpHueShort(h1, h2, t) {
    const diff = ((((h2 - h1) % 360) + 540) % 360) - 180;
    return (((h1 + diff * t) % 360) + 360) % 360;
  }

  function hsl2rgb(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s = Math.max(0, Math.min(100, s)) / 100;
    l = Math.max(0, Math.min(100, l)) / 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }

  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h *= 60;
    }
    return { h, s: s * 100, l: l * 100 };
  }

  function hsl2hex(h, s, l) {
    const [r, g, b] = hsl2rgb(h, s, l);
    const x = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
    return '#' + x(r) + x(g) + x(b);
  }

  function lerpWarmSunlightBridge(a, b, t, stopRole = 'mid') {
    const tClamped = Math.max(0, Math.min(1, t));
    const tEff = stopRole === 'horizon' ? Math.pow(tClamped, 0.65)
               : stopRole === 'top'     ? Math.pow(tClamped, 1.35)
               : tClamped;
    const u = cosInterp(tEff);
    const [r1, g1, b1] = hsl2rgb(a.h, a.s, a.l);
    const [r2, g2, b2] = hsl2rgb(b.h, b.s, b.l);
    const sunBoost = Math.sin(u * Math.PI);
    const r  = Math.max(0, Math.min(255, lerp(r1, r2, u) + 85 * sunBoost));
    const g  = Math.max(0, Math.min(255, lerp(g1, g2, u) - 20 * sunBoost));
    const bl = Math.max(0, Math.min(255, lerp(b1, b2, u) - 45 * sunBoost));
    const hsl = rgb2hsl(r, g, bl);
    const s = Math.max(hsl.s, lerp(a.s, b.s, u) * 0.78);
    const lShift = stopRole === 'top' ? -3 * sunBoost : (stopRole === 'horizon' ? 4 * sunBoost : 0);
    const l = Math.max(12, Math.min(85, lerp(a.l, b.l, u) + lShift));
    return { h: hsl.h, s, l, hex: hsl2hex(hsl.h, s, l) };
  }

    if (useWarmBridge) {
      return lerpWarmSunlightBridge(a, b, t, stopRole);
    }
    const u = cosInterp(t);
    const h = lerpHueShort(a.h, b.h, u);
    const s = lerp(a.s, b.s, u);
    const l = lerp(a.l, b.l, u);
    return { h, s, l, hex: hsl2hex(h, s, l) };
  }

    for (let i = 0; i < keyframes.length - 1; i++) {

      const next = keyframes[i + 1];
      if (hour24 >= curr.hour && hour24 <= next.hour) {
        const span = next.hour - curr.hour;
        const localT = span > 0 ? (hour24 - curr.hour) / span : 0;
        return { curr, next, localT };
      }
    }
    const last = keyframes[keyframes.length - 2];
    const end  = keyframes[keyframes.length - 1];
    return { curr: last, next: end, localT: 1 };
  }

      const u = cosInterp(localT / 0.80);
      h = ((lerp(currTrack.hStart, currTrack.hEnd, u) % 360) + 360) % 360;
      s = currTrack.s;
      l = currTrack.l;
    } else {
      const b = cosInterp((localT - 0.80) / 0.20);
      const endH = ((currTrack.hEnd % 360) + 360) % 360;
      const nextStartH = ((nextTrack.hStart % 360) + 360) % 360;
      h = lerpHueShort(endH, nextStartH, b);
      s = lerp(currTrack.s, nextTrack.s, b);
      l = lerp(currTrack.l, nextTrack.l, b);
    }
    return { h, s, l, hex: hsl2hex(h, s, l) };

    { id: 'goldenAM', elev: 6,      rising: true,  ref: 7.5   },  // 朝のゴールデンアワー終わり
    { id: 'noon',     elev: null,                   ref: 12.25 },  // 南中
    { id: 'goldenPM', elev: 6,      rising: false, ref: 16.83 },  // 夕陽への遷移開始（16時台は青系×緑系を維持）
    { id: 'sunset',   elev: -0.833, rising: false, ref: 17.67 },  // 日の入り
    { id: 'duskC',    elev: -6,     rising: false, ref: 19.08 },  // 市民薄明の終わり（夕のマジックアワー終わり）
    { id: 'duskN',    elev: -12,    rising: false, ref: 19.92 },  // 航海薄明の終わり
  ];

  const skyLink = { source: 'off', lat: 35.68, lon: 139.69, cityIdx: 1, cache: null, cacheKey: '' };

  function sunElevationDeg(ms, latDeg, lonDeg) {
    const rad = Math.PI / 180;
    const n = ms / 86400000 + 2440587.5 - 2451545.0;
    const L = (280.460 + 0.9856474 * n) % 360;
    const g = (357.528 + 0.9856003 * n) * rad;
    const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
    const gmst = (280.46061837 + 360.98564736629 * n) % 360;
    const ha = (gmst + lonDeg) * rad - ra;
    const lat = latDeg * rad;
    return Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha)) / rad;
  }

  function tzOffsetMinutes(tz, date) {
    try {
      const p = {};
      new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }).formatToParts(date).forEach(x => { p[x.type] = x.value; });
      const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
      return Math.round((asUtc - Math.floor(date.getTime() / 1000) * 1000) / 60000);
    } catch (_) {
      return -date.getTimezoneOffset();
    }
  }

  // 時計の「その日の壁時計 0:00〜24:00」に対する太陽イベント時刻を求め、{real[], ref[], info} を返す。
  // 白夜・極夜などで日の出/日の入りが得られない場合は null（標準表示にフォールバック）。
  function computeSolarDay(date, lat, lon, offsetMin) {
    const wallMidnightUtc = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0);
    const e = new Array(1441);
    let maxI = 0;
    for (let m = 0; m <= 1440; m++) {
      e[m] = sunElevationDeg(wallMidnightUtc + (m - offsetMin) * 60000, lat, lon);
      if (e[m] > e[maxI]) maxI = m;
    }
    const cross = (level, rising) => {
      if (rising) {
        for (let i = 1; i <= maxI; i++) {
          if (e[i - 1] < level && e[i] >= level) return (i - 1 + (level - e[i - 1]) / (e[i] - e[i - 1])) / 60;
        }
      } else {
        for (let i = Math.max(1, maxI + 1); i <= 1440; i++) {
          if (e[i - 1] >= level && e[i] < level) return (i - 1 + (level - e[i - 1]) / (e[i] - e[i - 1])) / 60;
        }
      }
      return null;
    };
    const info = {};
    SOLAR_STEPS.forEach(s => { info[s.id] = s.elev === null ? maxI / 60 : cross(s.elev, s.rising); });
    if (info.sunrise == null || info.sunset == null) return null;

    const real = [], ref = [];
    SOLAR_STEPS.forEach(s => {
      if (info[s.id] != null) { real.push(info[s.id]); ref.push(s.ref); }
    });
    // 単調増加でなければ（時差の食い違い等）信頼できないのでフォールバック
    for (let i = 1; i < real.length; i++) {
      if (!(real[i] > real[i - 1])) return null;
    }
    // 夜（最後のイベント〜翌朝の最初のイベント）が負にならないことも確認
    if (!(real[0] + 24 > real[real.length - 1])) return null;
    return { real, ref, info };
  }

  function getSolarDay(date) {
    if (skyLink.source === 'off') return null;
    const key = `${skyLink.source}|${skyLink.cityIdx}|${skyLink.lat}|${skyLink.lon}|${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
    if (skyLink.cacheKey === key) return skyLink.cache;
    let result = null;
    if (skyLink.source === 'city') {
      const c = SOLAR_CITIES[skyLink.cityIdx];
      const noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
      result = computeSolarDay(date, c.lat, c.lon, tzOffsetMinutes(c.tz, noon));
    } else {
      const noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
      result = computeSolarDay(date, skyLink.lat, skyLink.lon, -noon.getTimezoneOffset());
    }
    skyLink.cacheKey = key;
    skyLink.cache = result;
    return result;
  }

  // 実時刻(h) → 標準キーフレーム上の時刻(h)
  function warpHour(x, solar) {
    if (!solar) return x;
    const n = solar.real.length;
    const R = solar.real.concat([solar.real[0] + 24]);
    const F = solar.ref.concat([solar.ref[0] + 24]);
    const xr = x < R[0] ? x + 24 : x;
    for (let i = 0; i < n; i++) {
      if (xr >= R[i] && xr <= R[i + 1]) {
        const t = (xr - R[i]) / (R[i + 1] - R[i]);
        return (((F[i] + (F[i + 1] - F[i]) * t) % 24) + 24) % 24;
      }
    }
    return x;
  }

  function getTimeColor(date) {
    const totalSeconds =
      date.getHours() * 3600 +
      date.getMinutes() * 60 +
      date.getSeconds() +
      date.getMilliseconds() / 1000;

    const dayProgress = totalSeconds / 86400;
    // 空の連動ON時は、太陽高度に基づいて空色テーブルの時刻を伸縮させる
    const hour24 = warpHour(dayProgress * 24, getSolarDay(date));
    const skyProgress = hour24 / 24;
    const exactPhase = skyProgress * 8;
    const idx = Math.floor(exactPhase) % 8;
    const nextIdx = (idx + 1) % 8;
    const localT = exactPhase - Math.floor(exactPhase);
    const phaseMeta = PHASE_LABELS[idx];

    if (themeMode === 'hourGrad' || themeMode === 'allGrad') {
      const { curr, next, localT: kfT } = findKeyframePair(SKY_GRADIENT_KEYFRAMES, hour24);
      const wb = Boolean(next.warmBridgeFromPrev);

      const skyTop     = lerpHSLNode(curr.skyTop,     next.skyTop,     kfT, wb, 'top');
      const skyMid     = lerpHSLNode(curr.skyMid,     next.skyMid,     kfT, wb, 'mid');
      const skyHorizon = lerpHSLNode(curr.skyHorizon, next.skyHorizon, kfT, wb, 'horizon');
      const mainStart  = lerpHSLNode(curr.mainStart,  next.mainStart,  kfT, wb, 'mid');
      const mainEnd    = lerpHSLNode(curr.mainEnd,    next.mainEnd,    kfT, wb, 'mid');
      const accStart   = lerpHSLNode(curr.accStart,   next.accStart,   kfT, wb, 'mid');
      const accEnd     = lerpHSLNode(curr.accEnd,     next.accEnd,     kfT, wb, 'mid');
      const ringBg     = lerpHSLNode(curr.ringBg,     next.ringBg,     kfT, wb, 'top');

      return {
        gradMode: themeMode,
        skyTop: skyTop.hex,
        skyMid: skyMid.hex,
        skyHorizon: skyHorizon.hex,
        mainStart: mainStart.hex,
        mainEnd: mainEnd.hex,
        accStart: accStart.hex,
        accEnd: accEnd.hex,
        mainColor: mainStart.hex,
        backgroundColor: skyMid.hex,
        accentColor: accStart.hex,
        ringBgColor: ringBg.hex,
        screenBg: '#111111',
        dayProgress,
        phase: phaseMeta,
        hsl: {
          h: Math.round(skyMid.h),
          s: Math.round(skyMid.s),
          l: Math.round(skyMid.l)
        }
      };
    } else if (themeMode === 'sky24h') {
      const { curr, next, localT: kfT } = findKeyframePair(SKY_24H_KEYFRAMES, hour24);
      const wb = Boolean(next.warmBridgeFromPrev);

      const bg     = lerpHSLNode(curr.bg,     next.bg,     kfT, wb, 'mid');
      const main   = lerpHSLNode(curr.main,   next.main,   kfT, wb, 'mid');
      const accent = lerpHSLNode(curr.accent, next.accent, kfT, wb, 'mid');
      const accEnd = lerpHSLNode(curr.accEnd, next.accEnd, kfT, wb, 'mid');
      const ringBg = lerpHSLNode(curr.ringBg, next.ringBg, kfT, wb, 'top');

      return {
        gradMode: 'none',
        mainColor: main.hex,
        backgroundColor: bg.hex,
        accentColor: accent.hex,
        accStart: accent.hex,
        accEnd: accEnd.hex,
        ringBgColor: ringBg.hex,
        screenBg: '#111111',
        dayProgress,
        phase: phaseMeta,
        hsl: {
          h: Math.round(bg.h),
          s: Math.round(bg.s),
          l: Math.round(bg.l)
        }
      };
    } else {
      const curr = CLASSIC_PHASES[idx];
      const next = CLASSIC_PHASES[nextIdx];

      const main   = interpClassicTrack(curr.main,   next.main,   localT);
      const accent = interpClassicTrack(curr.accent, next.accent, localT);
      const bg     = interpClassicTrack(curr.bg,     next.bg,     localT);
      const ringBg = interpClassicTrack(curr.ringBg, next.ringBg, localT);
      const accEndHex = hsl2hex(accent.h + 28, accent.s, Math.max(24, accent.l - 12));

      return {
        gradMode: 'none',
        mainColor: main.hex,
        backgroundColor: bg.hex,
        accentColor: accent.hex,
        accStart: accent.hex,
        accEnd: accEndHex,
        ringBgColor: ringBg.hex,
        screenBg: '#111111',
        dayProgress,
        phase: curr,
        hsl: {
          h: Math.round(bg.h),
          s: Math.round(bg.s),
          l: Math.round(bg.l)
        }
      };
    }
  }

  const skyStrip = document.getElementById('sky-strip');
  function updateSkyStrip() {
    const stops = [];
    const steps = 96;
    for (let i = 0; i <= steps; i++) {
      const sec = (i / steps) * 86399;
      const d = makeDateFromSeconds(sec);
      const c = getTimeColor(d);
      const pct = ((i / steps) * 100).toFixed(2);
      stops.push(`${c.backgroundColor} ${pct}%`);
    }
    skyStrip.style.background = `linear-gradient(90deg, ${stops.join(', ')})`;
  }

  /* ==========================================================================
   * 2. 時計描画ロジック
   *    - 外周秒リング：secGradOn に応じて「円周グラデーション」と「フラット単色」を切り替え
   *    - 短針（ベース面）：hourGrad / allGrad では空グラデーション、sky24h / classic では単色
   *    - 長針（ウェッジ）：allGrad ではグラデーション、それ以外ではフラット単色
   * ========================================================================== */
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vv = window.visualViewport;
    W = vv ? Math.round(vv.width) : window.innerWidth;
    H = vv ? Math.round(vv.height) : window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }

  function circle(cx, cy, r, fillStyle) {
    ctx.fillStyle = fillStyle;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fill();
  }

  function sector(cx, cy, r, startAngle, endAngle, fillStyle) {
    if (endAngle <= startAngle) return;
    ctx.fillStyle = fillStyle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fill();
  }

  let smoothHour = true;

  // 短針（空）のグラデーション生成（長針ウェッジに隠れない露出領域［aMin ➔ aHr + 2π］に合わせて天頂〜地平線グラデーションを最適配置）
  function createHourSkyGradient(cx, cy, r, aHr, aMin, colors) {
    if (gradStyle === 'conic' && typeof ctx.createConicGradient === 'function') {
      const visFrac = Math.max(0.08, Math.min(1.0, ((aHr + TAU) - aMin) / TAU));
      const g = ctx.createConicGradient(aMin, cx, cy);
      g.addColorStop(0.0, colors.skyTop);
      g.addColorStop(visFrac * 0.5, colors.skyMid);
      g.addColorStop(visFrac, colors.skyHorizon);
      if (visFrac < 1.0) g.addColorStop(1.0, colors.skyHorizon);
      return g;
    } else if (gradStyle === 'radial') {
      const g = ctx.createRadialGradient(cx, cy, r * 0.05, cx, cy, r);
      g.addColorStop(0.0, colors.skyHorizon);
      g.addColorStop(0.55, colors.skyMid);
      g.addColorStop(1.0, colors.skyTop);
      return g;
    } else {
      const aStart = aMin;
      const aEnd = aHr + TAU;
      let yMin = Math.min(0, Math.sin(aStart), Math.sin(aEnd));
      let yMax = Math.max(0, Math.sin(aStart), Math.sin(aEnd));
      for (let k = -1; k <= 2; k++) {
        const topA = -Math.PI / 2 + k * TAU;
        if (topA >= aStart && topA <= aEnd) yMin = -1;
        const botA = Math.PI / 2 + k * TAU;
        if (botA >= aStart && botA <= aEnd) yMax = 1;
      }
      if (yMax - yMin < 0.24) {
        const midY = (yMin + yMax) * 0.5;
        yMin = Math.max(-1, midY - 0.12);
        yMax = Math.min(1, midY + 0.12);
      }
      const y0 = cy + lerp(-1, yMin, 0.86) * r;
      const y1 = cy + lerp(1, yMax, 0.86) * r;
      const g = ctx.createLinearGradient(cx, y0, cx, y1);
      g.addColorStop(0.0, colors.skyTop);
      g.addColorStop(0.50, colors.skyMid);
      g.addColorStop(1.0, colors.skyHorizon);
      return g;
    }
  }

  // 外周秒リングのグラデーション生成（12時位置から現在の秒針の先端へ向けて円周状に変化）
  function createSecondRingFill(cx, cy, R, sec, colors) {
    if (!secGradOn) {
      return colors.accentColor;
    }
    if (typeof ctx.createConicGradient === 'function') {
      const g = ctx.createConicGradient(START, cx, cy);
      const endStop = Math.max(0.02, Math.min(1.0, sec));
      g.addColorStop(0.0, colors.accStart);
      g.addColorStop(endStop, colors.accEnd);
      if (endStop < 1.0) g.addColorStop(1.0, colors.accEnd);
      return g;
    }
    const g = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    g.addColorStop(0, colors.accStart);
    g.addColorStop(1, colors.accEnd);
    return g;
  }

  function drawClockForDate(cx, cy, R, date) {
    const colors = getTimeColor(date);
    const sec = (date.getSeconds() + date.getMilliseconds() / 1000) / 60;
    const min = (date.getMinutes() + sec) / 60;
    const h   = date.getHours() % 12;
    const hrAngle = smoothHour ? (h + min) / 12 : h / 12;

    const r = R * (1 - RING_RATIO);
    const aHr = START + TAU * hrAngle;
    let aMin  = START + TAU * min;
    if (aMin <= aHr) aMin += TAU;

    // 1. 外周秒リング（secGradOn でグラデーション ⇔ ソリッド単色を切り替え）
    circle(cx, cy, R, colors.ringBgColor);
    if (sec > 0) {
      const secFill = createSecondRingFill(cx, cy, R, Math.min(sec, 1), colors);
      sector(cx, cy, R, START, START + TAU * Math.min(sec, 1), secFill);
    }

    // 2. 短針（ベース面）
    if (colors.gradMode === 'hourGrad' || colors.gradMode === 'allGrad') {
      const skyFill = createHourSkyGradient(cx, cy, r, aHr, aMin, colors);
      circle(cx, cy, r, skyFill);
    } else {
      circle(cx, cy, r, colors.backgroundColor);
    }

    // 3. 長針（ウェッジ）
    if (colors.gradMode === 'allGrad') {
      const midAngle = (aHr + aMin) * 0.5;
      const sunGrad = ctx.createLinearGradient(
        cx + Math.cos(aHr) * r * 0.8,
        cy + Math.sin(aHr) * r * 0.8,
        cx + Math.cos(midAngle) * r,
        cy + Math.sin(midAngle) * r
      );
      sunGrad.addColorStop(0, colors.mainStart);
      sunGrad.addColorStop(1, colors.mainEnd);
      sector(cx, cy, r, aHr, aMin, sunGrad);
    } else {
      sector(cx, cy, r, aHr, aMin, colors.mainColor);
    }

    return colors;
  }

  /* ==========================================================================
   * 3. モード管理・アニメーションループ（デフォルト：現在時刻 'live'）
   * ========================================================================== */
  let mode = 'live';
  let timelapseStart = performance.now();
  let compareStart = performance.now();

  const slider = document.getElementById('time-slider');
  const scrubberTimeLabel = document.getElementById('scrubber-time');

  function makeDateFromSeconds(totalSec) {
    const d = new Date();
    const sNorm = ((totalSec % 86400) + 86400) % 86400;
    const hh = Math.floor(sNorm / 3600);
    const mm = Math.floor((sNorm % 3600) / 60);
    const ss = Math.floor(sNorm % 60);
    const ms = Math.round((sNorm - Math.floor(sNorm)) * 1000);
    d.setHours(hh, mm, ss, ms);
    return d;
  }

  function formatHMS(date) {
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    const ss = String(date.getSeconds()).padStart(2, '0');
    return `${hh}:${mm}:${ss}`;
  }

  function getThemeTitle() {
    const secLabel = secGradOn ? '秒リング＝グラデ✨' : '秒リング＝単色●';
    if (themeMode === 'hourGrad') {
      return `【① 短針グラデ × 長針単色 (${secLabel}) 🌅】短針が空のグラデーション、長針はフラット単色`;
    } else if (themeMode === 'sky24h') {
      return `【② 短針・長針とも単色 (${secLabel}) 🌤️】短針の色が24時間で空の色として連続変化`;
    } else if (themeMode === 'allGrad') {
      return `【③ 短針・長針ともグラデ (${secLabel}) 🌈】短針も長針もグラデーションで描画`;
    } else {
      return `【④ 従来ソリッド版 (${secLabel}) 🎨】（12:00-15:00の短針＝スカーレット赤）`;
    }
  }

  function frame() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'butt';

    const themeTitle = getThemeTitle();

    if (mode === 'live' || mode === 'timelapse' || mode === 'scrub') {
      let targetDate;
      if (mode === 'live') {
        targetDate = new Date();
        const curSec = targetDate.getHours() * 3600 + targetDate.getMinutes() * 60 + targetDate.getSeconds();
        slider.value = curSec;
      } else if (mode === 'timelapse') {
        const elapsedSec = (performance.now() - timelapseStart) / 1000;
        const simSec = (elapsedSec * 3600) % 86400;
        targetDate = makeDateFromSeconds(simSec);
        slider.value = Math.floor(simSec);
      } else {
        const baseSec = Number(slider.value);
        const subSec = ((performance.now() - compareStart) / 1000) % 60;
        targetDate = makeDateFromSeconds(baseSec + subSec);
      }

      scrubberTimeLabel.textContent = formatHMS(targetDate);

      const isMobile = Math.min(W, H) < 600;
      const isPortrait = W < H;
      const scaleFactor = getClockScaleFactor(isMobile, isPortrait);
      const R = Math.min(W, H) * scaleFactor / 2;
      const colors = drawClockForDate(W / 2, H / 2, R, targetDate);

      if (!document.body.classList.contains('idle')) {
        ctx.textAlign = 'left';
        if (isMobile) {
          ctx.fillStyle = '#eeeeee';
          ctx.font = '700 13px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
          ctx.fillText(`${formatHMS(targetDate)}  [${colors.phase.name}]`, 16, 26);

          ctx.fillStyle = '#9999a5';
          ctx.font = '500 10px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
          const shortThemeTitle = themeMode === 'hourGrad' ? '短針グラデ × 長針単色'
            : themeMode === 'sky24h' ? '短針・長針とも単色(24h空色)'
            : themeMode === 'allGrad' ? '短針・長針ともグラデ' : '従来ソリッド版';
          ctx.fillText(`${shortThemeTitle} (${secGradOn ? '秒グラデ✨' : '秒単色●'})`, 16, 42);
        } else {
          ctx.fillStyle = '#eeeeee';
          ctx.font = '700 15px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
          ctx.fillText(
            `${formatHMS(targetDate)}  [${colors.phase.range} : ${colors.phase.name}]  短針(空) HSL(${colors.hsl.h}°, ${colors.hsl.s}%, ${colors.hsl.l}%)`,
            20, 26
          );

          ctx.fillStyle = '#9999a5';
          ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
          ctx.fillText(
            `${themeTitle}`,
            20, 46
          );
        }
      }

    } else if (mode === 'compare') {
      const elapsedSec = (performance.now() - compareStart) / 1000;
      const d1220 = makeDateFromSeconds(12 * 3600 + 20 * 60 + 45 + elapsedSec);
      const d1705 = makeDateFromSeconds(17 * 3600 + 5 * 60 + 45 + elapsedSec);

      const isPortrait = W < H;
      if (isPortrait) {
        const topPad = 42;
        const botPad = 72;
        const availH = H - topPad - botPad;
        const ch = availH / 2;
        const scale = clockScaleMode === 'huge' ? 0.90 : (clockScaleMode === 'standard' ? 0.70 : 0.84);
        const R = Math.min(W * (scale + 0.02), ch * scale) / 2;

        const cy1 = topPad + ch * 0.5 + 8;
        const cy2 = topPad + ch * 1.5 + 8;

        const c1 = drawClockForDate(W / 2, cy1, R, d1220);
        const c2 = drawClockForDate(W / 2, cy2, R, d1705);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#eeeeee';
        ctx.font = '700 13px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
        ctx.fillText(`12:20 (${formatHMS(d1220)}) — ${c1.phase.name}`, W / 2, topPad + 12);
        ctx.fillText(`17:05 (${formatHMS(d1705)}) — ${c2.phase.name}`, W / 2, topPad + ch + 12);

        ctx.fillStyle = '#26262c';
        ctx.fillRect(16, topPad + ch, W - 32, 1);
      } else {
        const cw = W / 2;
        const ch = H - 76;
        const scale = clockScaleMode === 'huge' ? 0.90 : (clockScaleMode === 'standard' ? 0.74 : 0.86);
        const R = Math.min(cw, ch) * scale / 2;

        const c1 = drawClockForDate(cw / 2, ch / 2 + 24, R, d1220);
        const c2 = drawClockForDate(cw + cw / 2, ch / 2 + 24, R, d1705);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#eeeeee';
        ctx.font = '700 17px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
        ctx.fillText(`12:20 (${formatHMS(d1220)}) — ${c1.phase.name}`, cw / 2, 34);
        ctx.fillText(`17:05 (${formatHMS(d1705)}) — ${c2.phase.name}`, cw + cw / 2, 34);

        ctx.fillStyle = '#9999a5';
        ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
        ctx.fillText(themeTitle, cw, 56);

        ctx.fillStyle = '#26262c';
        ctx.fillRect(cw - 0.5, 0, 1, H);
      }

    } else if (mode === 'all8') {
      const isPortrait = W < H;
      const cols = isPortrait ? 2 : 4;
      const rows = isPortrait ? 4 : 2;
      const topPad = isPortrait ? 38 : 46;
      const botPad = isPortrait ? 76 : 82;
      const cw = W / cols;
      const ch = (H - topPad - botPad) / rows;
      const scale = clockScaleMode === 'huge' ? 0.88 : (clockScaleMode === 'standard' ? 0.70 : 0.82);
      const R = Math.min(cw * (scale + 0.04), ch * scale) / 2;
      const elapsedSec = ((performance.now() - compareStart) / 1000) % 60;

      ctx.textAlign = 'left';
      ctx.fillStyle = '#38bdf8';
      ctx.font = isPortrait ? '700 11px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif'
                            : '700 12px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
      ctx.fillText(isPortrait ? '8フェーズ一覧 (タップで拡大)' : `${themeTitle}`, 16, 18);

      for (let i = 0; i < 8; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x0 = col * cw;
        const y0 = topPad + row * ch;
        const cx = x0 + cw / 2;
        const cy = y0 + ch / 2 + (isPortrait ? 12 : 14);

        const baseSec = PHASE_LABELS[i].sampleSec;
        const d = makeDateFromSeconds(baseSec - 45 + elapsedSec);
        drawClockForDate(cx, cy, R, d);

        const hhStr = String(d.getHours()).padStart(2, '0');
        const mmStr = String(d.getMinutes()).padStart(2, '0');

        ctx.textAlign = 'center';
        ctx.fillStyle = '#eeeeee';
        ctx.font = isPortrait ? '700 11px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif'
                              : '700 12px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
        ctx.fillText(`${i + 1}. ${PHASE_LABELS[i].range} (${hhStr}:${mmStr})`, cx, y0 + 10);

        ctx.fillStyle = '#aaaaaa';
        ctx.font = isPortrait ? '600 10px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif'
                              : '600 11px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
        ctx.fillText(`${PHASE_LABELS[i].name}`, cx, y0 + (isPortrait ? 22 : 24));

        if (col > 0) {
          ctx.fillStyle = '#1f1f24';
          ctx.fillRect(x0 - 0.5, topPad, 1, H - topPad - botPad);
        }
      }

      for (let r = 1; r < rows; r++) {
        ctx.fillStyle = '#1f1f24';
        ctx.fillRect(0, topPad + r * ch - 0.5, W, 1);
      }
    }

    requestAnimationFrame(frame);
  }

  /* ==========================================================================
   * 4. UIイベント ＆ モバイル対応
   * ========================================================================== */
  const toolbar        = document.getElementById('toolbar');
  const mobileMenuBtn  = document.getElementById('mobile-menu-btn');
  const mobileCloseBtn = document.getElementById('mobile-close-btn');
  const btnWakeLock    = document.getElementById('btn-wake-lock');
  const btnClockSize   = document.getElementById('btn-clock-size');

  function updateClockSizeButton() {
    if (!btnClockSize) return;
    if (clockScaleMode === 'huge') {
      btnClockSize.textContent = '時計サイズ: 画面最大 (95%) 💥';
      btnClockSize.classList.add('sec-active');
      btnClockSize.classList.remove('theme-active');
    } else if (clockScaleMode === 'standard') {
      btnClockSize.textContent = '時計サイズ: 標準 (76%)';
      btnClockSize.classList.remove('sec-active', 'theme-active');
    } else {
      btnClockSize.textContent = '時計サイズ: どーんと大 (90%) ✨';
      btnClockSize.classList.add('theme-active');
      btnClockSize.classList.remove('sec-active');
    }
  }

  if (btnClockSize) {
    btnClockSize.addEventListener('click', e => {
      e.stopPropagation();
      if (clockScaleMode === 'large') {
        clockScaleMode = 'huge';
      } else if (clockScaleMode === 'huge') {
        clockScaleMode = 'standard';
      } else {
        clockScaleMode = 'large';
      }
      try {
        localStorage.setItem('pieclock.scale', clockScaleMode);
      } catch (_) {}
      updateClockSizeButton();
    });
    updateClockSizeButton();
  }

  function closeDrawer() {
    toolbar.classList.remove('open');
    toolbar.classList.remove('mobile-open');
    wake();
  }

  function openDrawer() {
    toolbar.classList.add('open');
    toolbar.classList.add('mobile-open');
    wake();
  }

  function toggleDrawer() {
    if (toolbar.classList.contains('open') || toolbar.classList.contains('mobile-open')) {
      closeDrawer();
    } else {
      openDrawer();
    }
  }

  function closeMobileDrawer() {
    if (window.innerWidth <= 768) {
      closeDrawer();
    }
  }

  mobileMenuBtn.addEventListener('click', e => {
    e.stopPropagation();
    toggleDrawer();
  });

  mobileCloseBtn.addEventListener('click', e => {
    e.stopPropagation();
    closeDrawer();
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (toolbar.classList.contains('open') || toolbar.classList.contains('mobile-open')) {
        closeDrawer();
      }
    } else if ((e.key === 'm' || e.key === 'M') && !['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
      toggleDrawer();
    }
  });

  const btnHourGrad  = document.getElementById('btn-theme-hourgrad');
  const btnSky24h    = document.getElementById('btn-theme-sky24h');
  const btnAllGrad   = document.getElementById('btn-theme-allgrad');
  const btnClassic   = document.getElementById('btn-theme-classic');
  const btnGradDir   = document.getElementById('btn-grad-dir');
  const btnSecGrad   = document.getElementById('btn-sec-grad');

  const btnAll8      = document.getElementById('btn-all8');
  const btnCompare   = document.getElementById('btn-compare');
  const btnLive      = document.getElementById('btn-live');
  const btnTimelapse = document.getElementById('btn-timelapse');
  const btnHourMode  = document.getElementById('btn-hour-mode');

  function setThemeMode(newTheme) {
    themeMode = newTheme;
    [btnHourGrad, btnSky24h, btnAllGrad, btnClassic].forEach(b => b.classList.remove('theme-active'));
    if (newTheme === 'hourGrad') btnHourGrad.classList.add('theme-active');
    if (newTheme === 'sky24h')   btnSky24h.classList.add('theme-active');
    if (newTheme === 'allGrad')  btnAllGrad.classList.add('theme-active');
    if (newTheme === 'classic')  btnClassic.classList.add('theme-active');
    btnGradDir.style.display = (newTheme === 'hourGrad' || newTheme === 'allGrad') ? '' : 'none';
    updateSkyStrip();
    closeMobileDrawer();
  }

  btnHourGrad.addEventListener('click', e => { e.stopPropagation(); setThemeMode('hourGrad'); });
  btnSky24h.addEventListener('click',   e => { e.stopPropagation(); setThemeMode('sky24h'); });
  btnAllGrad.addEventListener('click',  e => { e.stopPropagation(); setThemeMode('allGrad'); });
  btnClassic.addEventListener('click',  e => { e.stopPropagation(); setThemeMode('classic'); });

  btnSecGrad.addEventListener('click', e => {
    e.stopPropagation();
    secGradOn = !secGradOn;
    btnSecGrad.textContent = secGradOn ? '秒リング: グラデーション ✨' : '秒リング: ソリッド単色 ●';
    btnSecGrad.classList.toggle('sec-active', secGradOn);
  });

  btnGradDir.addEventListener('click', e => {
    e.stopPropagation();
    if (gradStyle === 'vertical') {
      gradStyle = 'conic';
      btnGradDir.textContent = '短針グラデ方向: 円周角度';
    } else if (gradStyle === 'conic') {
      gradStyle = 'radial';
      btnGradDir.textContent = '短針グラデ方向: 中心➔外周';
    } else {
      gradStyle = 'vertical';
      btnGradDir.textContent = '短針グラデ方向: 天頂➔地平線';
    }
  });

  function setActiveButton(target) {
    [btnAll8, btnCompare, btnLive, btnTimelapse].forEach(b => b.classList.toggle('active', b === target));
    closeMobileDrawer();
  }

  btnAll8.addEventListener('click', e => {
    e.stopPropagation();
    mode = 'all8';
    compareStart = performance.now();
    setActiveButton(btnAll8);
  });

  btnCompare.addEventListener('click', e => {
    e.stopPropagation();
    mode = 'compare';
    compareStart = performance.now();
    setActiveButton(btnCompare);
  });

  btnLive.addEventListener('click', e => {
    e.stopPropagation();
    mode = 'live';
    setActiveButton(btnLive);
  });

  btnTimelapse.addEventListener('click', e => {
    e.stopPropagation();
    mode = 'timelapse';
    timelapseStart = performance.now();
    setActiveButton(btnTimelapse);
  });

  btnHourMode.addEventListener('click', e => {
    e.stopPropagation();
    smoothHour = !smoothHour;
    btnHourMode.textContent = smoothHour ? '短針: 滑らか' : '短針: 固定';
    btnHourMode.classList.toggle('active', !smoothHour);
  });

  slider.addEventListener('input', () => {
    mode = 'scrub';
    compareStart = performance.now();
    setActiveButton(null);
  });

  canvas.addEventListener('click', e => {
    if (toolbar.classList.contains('open') || toolbar.classList.contains('mobile-open')) {
      closeDrawer();
      return;
    }
    if (mode === 'all8') {
      const isPortrait = W < H;
      const cols = isPortrait ? 2 : 4;
      const rows = isPortrait ? 4 : 2;
      const topPad = isPortrait ? 38 : 46;
      const botPad = isPortrait ? 76 : 82;
      const cw = W / cols;
      const ch = (H - topPad - botPad) / rows;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      if (clickY >= topPad && clickY <= H - botPad) {
        const col = Math.min(cols - 1, Math.max(0, Math.floor(clickX / cw)));
        const row = Math.min(rows - 1, Math.max(0, Math.floor((clickY - topPad) / ch)));
        const idx = row * cols + col;
        if (idx >= 0 && idx < PHASE_LABELS.length) {
          slider.value = PHASE_LABELS[idx].sampleSec;
          compareStart = performance.now();
          mode = 'scrub';
          setActiveButton(null);
        }
      }
    } else if (mode === 'scrub') {
      mode = 'all8';
      setActiveButton(btnAll8);
    }
  });

  /* ==========================================================================
   * 5. Screen Wake Lock API（常時点灯） ＆ アイドル制御
   * ========================================================================== */
  let wakeLock = null;
  let wakeLockEnabled = true;

  async function requestWakeLock() {
    if (!wakeLockEnabled || !('wakeLock' in navigator)) return;
    try {
      if (document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
        });
        btnWakeLock.textContent = '📱 スリープ防止: ON';
        btnWakeLock.classList.add('sec-active');
      }
    } catch (_) {}
  }

  async function releaseWakeLock() {
    if (wakeLock) {
      try { await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }
    btnWakeLock.textContent = '📱 スリープ防止: OFF';
    btnWakeLock.classList.remove('sec-active');
  }

  if ('wakeLock' in navigator) {
    btnWakeLock.addEventListener('click', async e => {
      e.stopPropagation();
      wakeLockEnabled = !wakeLockEnabled;
      if (wakeLockEnabled) {
        await requestWakeLock();
      } else {
        await releaseWakeLock();
      }
    });
  } else {
    btnWakeLock.textContent = '📱 スリープ防止: ブラウザ非対応';
    btnWakeLock.style.opacity = '0.5';
    btnWakeLock.disabled = true;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLockEnabled) {
      requestWakeLock();
    }
  });

  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    if (!toolbar.classList.contains('open') && !toolbar.classList.contains('mobile-open')) {
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
    }
    if (wakeLockEnabled && !wakeLock) {
      requestWakeLock();
    }
  }
  window.addEventListener('mousemove', wake);
  window.addEventListener('pointerdown', wake);
  window.addEventListener('touchstart', wake, { passive: true });
  wake();

  /* ==========================================================================
   * 6. 空の連動（標準 / 現在地の太陽 / 都市選択）
   * ========================================================================== */
  const btnLinkOff   = document.getElementById('btn-link-off');
  const btnLinkGps   = document.getElementById('btn-link-gps');
  const citySelect   = document.getElementById('city-select');
  const linkStatus   = document.getElementById('link-status');

  SOLAR_CITIES.forEach((c, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = c.name;
    citySelect.appendChild(opt);
  });

  const fmtHM = h => {
    if (h == null) return '--:--';
    const t = Math.round(((h % 24) + 24) % 24 * 60) % 1440;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  };

  function saveLinkPrefs(extra) {
    try {
      const prev = JSON.parse(localStorage.getItem('pieclock.skylink') || '{}');
      localStorage.setItem('pieclock.skylink', JSON.stringify(Object.assign(prev, { source: skyLink.source, city: skyLink.cityIdx }, extra || {})));
    } catch (_) {}
  }

  function refreshLinkUI(message) {
    btnLinkOff.classList.toggle('theme-active', skyLink.source === 'off');
    btnLinkGps.classList.toggle('theme-active', skyLink.source === 'gps');
    citySelect.classList.toggle('theme-active', skyLink.source === 'city');
    citySelect.value = skyLink.source === 'city' ? String(skyLink.cityIdx) : '';

    let text = message || '';
    if (!message) {
      if (skyLink.source === 'off') {
        text = '標準：固定の時刻テーブル（東京の春秋分ごろの空）';
      } else {
        const s = getSolarDay(new Date());
        const where = skyLink.source === 'gps'
          ? `📍 現在地 (${skyLink.lat.toFixed(2)}, ${skyLink.lon.toFixed(2)})`
          : `🌍 ${SOLAR_CITIES[skyLink.cityIdx].name}（時計＝現地時刻とみなす）`;
        if (!s) {
          text = `${where}\nこの地域・季節では日の出/日の入りが無い、または時刻が前後するため標準表示にしています`;
        } else {
          const i = s.info;
          text = `${where}\n日の出 ${fmtHM(i.sunrise)} ／ 日の入 ${fmtHM(i.sunset)}` +
                 `\nゴールデンアワー ${fmtHM(i.goldenPM)}〜 ／ マジックアワー ${fmtHM(i.sunset)}〜${fmtHM(i.duskC)}`;
        }
      }
    }
    linkStatus.textContent = text;
  }

  function applyLink(message) {
    skyLink.cache = null;
    skyLink.cacheKey = '';
    refreshLinkUI(message);
    updateSkyStrip();
  }

  function setLinkOff() {
    skyLink.source = 'off';
    saveLinkPrefs();
    applyLink();
  }

  function setLinkCity(idx) {
    skyLink.source = 'city';
    skyLink.cityIdx = idx;
    saveLinkPrefs();
    applyLink();
  }

  function setLinkGps(silent) {
    if (!('geolocation' in navigator)) {
      skyLink.source = 'off';
      applyLink('このブラウザは位置情報に対応していません');
      return;
    }
    if (!silent) refreshLinkUI('📍 位置情報を取得中…');
    navigator.geolocation.getCurrentPosition(pos => {
      skyLink.source = 'gps';
      skyLink.lat = pos.coords.latitude;
      skyLink.lon = pos.coords.longitude;
      saveLinkPrefs({ lat: skyLink.lat, lon: skyLink.lon });
      applyLink();
    }, err => {
      if (silent && skyLink.source === 'gps') return; // 前回の座標のまま継続
      skyLink.source = 'off';
      saveLinkPrefs();
      const reason = err && err.code === 1
        ? '位置情報の利用が許可されていません'
        : '位置情報を取得できませんでした（https または localhost で開いてください）';
      applyLink(reason + '。標準表示に戻しました');
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 3600000 });
  }

  btnLinkOff.addEventListener('click', e => { e.stopPropagation(); setLinkOff(); });
  btnLinkGps.addEventListener('click', e => { e.stopPropagation(); setLinkGps(false); });
  citySelect.addEventListener('click', e => e.stopPropagation());
  citySelect.addEventListener('change', e => {
    e.stopPropagation();
    if (citySelect.value === '') { setLinkOff(); } else { setLinkCity(parseInt(citySelect.value, 10)); }
  });

  // 前回の設定を復元
  try {
    const prefs = JSON.parse(localStorage.getItem('pieclock.skylink') || '{}');
    if (prefs.source === 'city' && SOLAR_CITIES[prefs.city]) {
      skyLink.source = 'city';
      skyLink.cityIdx = prefs.city;
    } else if (prefs.source === 'gps' && typeof prefs.lat === 'number' && typeof prefs.lon === 'number') {
      // 直近の座標で即座に反映し、バックグラウンドで最新位置に更新
      skyLink.source = 'gps';
      skyLink.lat = prefs.lat;
      skyLink.lon = prefs.lon;
      setTimeout(() => setLinkGps(true), 0);
    }
  } catch (_) {}

  // 日付が変わったら（日の出・日の入りが変わるため）空色ストリップを再生成
  let lastLinkDay = new Date().toDateString();
  setInterval(() => {
    const d = new Date().toDateString();
    if (d !== lastLinkDay) {
      lastLinkDay = d;
      applyLink();
    }
  }, 60000);

  refreshLinkUI();
  updateSkyStrip();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
